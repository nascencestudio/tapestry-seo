# Weekly: refreshes the AI crawler list from ai.robots.txt (scripts/update-bots.mjs) and keeps one
# pull request (branch `update-bots`) up to date with it, for review before the next release
# (ADR 0001). Each run replaces the branch with a fresh refresh of main, so unmerged weeks don't
# pile up; when main already has the latest list, the pull request is closed. Sites never fetch
# the list themselves.
#
# Setup once: Settings → Actions → General → "Allow GitHub Actions to create and approve pull
# requests". Pushes with the workflow's own token don't start other workflows, so this one starts
# CI on the branch itself (workflow_dispatch, the required check then shows on the pull request).
name: Update crawler list

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-bots
  cancel-in-progress: false

jobs:
  update:
    name: Refresh ai.robots.txt data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # start CI on the branch
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm update-bots
      - name: Check the new list
        run: pnpm test && pnpm typecheck
      - name: Update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=update-bots
          today="$(date -u +%Y-%m-%d)"
          open="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if git diff --quiet; then
            echo "No changes."
            if [ -n "$open" ]; then gh pr close "$open" --delete-branch --comment "main already has the latest crawler list ($today)."; fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update the AI crawler list from ai.robots.txt ($today)"
          git push --force origin "$branch"
          title="Update the AI crawler list ($today)"
          body="Automated refresh of src/data/ai-bots.ts from ai.robots.txt, updated weekly on this branch until merged. Review the added, removed and re-categorized crawlers before merging (tests and typecheck passed in the workflow; CI runs on the branch)."
          if [ -n "$open" ]; then
            gh pr edit "$open" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
          gh workflow run ci.yml --ref "$branch"
